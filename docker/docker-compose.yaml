version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_estoque
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: estoque
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - estoque_network

  backend:
    build: ../backend
    container_name: backend_estoque
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: estoque
    depends_on:
      - mysql
    networks:
      - estoque_network

  frontend:
    build: ../frontend/frontend_estoque
    container_name: frontend_estoque
    ports:
      - "5173:80"   # 5173 no host, 80 no container (Nginx)
    depends_on:
      - backend
    networks:
      - estoque_network

volumes:
  mysql_data:

networks:
  estoque_network:
    driver: bridge
